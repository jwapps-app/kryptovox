[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Default ruleset (pyflakes F + pycodestyle E4/E7/E9) — catches real bugs like
# unused imports/names and undefined references without imposing noisy style
# rules on the existing code.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]  # so `app` imports under the `pytest` console script (not just `python -m pytest`)
