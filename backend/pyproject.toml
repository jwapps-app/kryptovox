[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Pyflakes F + pycodestyle E4/E7/E9 — catches real bugs like unused imports/names
# and undefined references without imposing noisy style rules on the existing code.
# Pinned explicitly (not relying on ruff's default select) so a ruff release that
# expands its defaults — e.g. B008, which flags FastAPI's idiomatic Depends() in
# argument defaults — doesn't retroactively fail CI on unchanged code.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]  # so `app` imports under the `pytest` console script (not just `python -m pytest`)
