# Kryptovox — Portainer stack (Synology / standalone Docker).
#
# Deploy via Portainer → Stacks → Add stack. Use the "Repository" method
# (this repo, compose path: docker-compose.portainer.yml) or paste this into the
# web editor. Set the environment variables listed at the bottom in Portainer's
# "Environment variables" section — there is no .env file in a Portainer stack.
#
# Pulls prebuilt images from GHCR (private) — add ghcr.io as a Registry in
# Portainer first (Registries → Add → Custom: ghcr.io, user + read:packages PAT).
# The NAS never builds anything.
#
# Ingress: nginx is published on <NAS-IP>:${WEB_PORT}. Point your existing
# Cloudflare Tunnel public hostname at HTTP -> <NAS-IP>:${WEB_PORT}. Cloudflare
# terminates TLS, so the public site is https:// (required for Web Crypto/PWA).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /volume1/docker/kryptovox/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${IMAGE_PREFIX}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    command: sh -c "alembic upgrade head && gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w ${BACKEND_WORKERS:-4} -b 0.0.0.0:8000 --forwarded-allow-ips='*'"
    environment:
      # DATABASE_URL/REDIS_URL are derived here so you don't have to type them.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-90}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      # Passkeys (WebAuthn). RP_ID = the domain passkeys bind to (can be the
      # registrable parent, e.g. example.com); ORIGIN = the full https origin the
      # app is served from. Required for passkey 2FA to work.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:5173}
      # Default message retention (days) for NEW conversations; 0 = keep forever.
      DEFAULT_RETENTION_DAYS: ${DEFAULT_RETENTION_DAYS:-0}
      VAPID_EMAIL: ${VAPID_EMAIL:-mailto:admin@example.com}
      VAPID_KEY_PATH: /data/vapid_private.pem
      MEDIA_DIR: /media
    volumes:
      # Named volumes (not /volume1 bind mounts): they inherit the image's `app`
      # ownership, so the non-root backend can write them. /data persists the
      # VAPID key; /media holds encrypted image blobs.
      - kryptovox-vapid:/data
      - kryptovox-media:/media
    healthcheck:
      # Readiness: /api/health probes Postgres (503 if down). start_period covers
      # the alembic migration on boot so the container isn't killed mid-upgrade.
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: ${IMAGE_PREFIX}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    depends_on:
      backend:
        condition: service_healthy
    # Published on the NAS so your existing Cloudflare Tunnel (or Synology
    # reverse proxy) can reach it at http://<NAS-IP>:${WEB_PORT}. Pick any free
    # host port. Cloudflare still serves the site over HTTPS at the edge.
    ports:
      - "${WEB_PORT:-8095}:80"

  # Nightly backup into /volume1/Backup/kryptovox, keeping the last 14 days.
  # Backs up ALL the durable state: the Postgres dump AND the encrypted media
  # blobs AND the VAPID key. A DB-only backup would restore with every image
  # broken (rows point at missing blobs) and push dead (lost signing key).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Set this <= your shortest message retention so deleted messages actually
      # age out of backups too (otherwise they linger here after deletion).
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - /volume1/Backup/kryptovox:/backup
      - kryptovox-media:/media:ro
      - kryptovox-vapid:/vapid:ro
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          ts=$$(date +%Y%m%d_%H%M%S)
          pg_dump -h postgres -U "$${POSTGRES_USER}" "$${POSTGRES_DB}" \
            | gzip > "/backup/kryptovox_$${ts}.sql.gz" \
            && echo "db backup written: kryptovox_$${ts}.sql.gz" \
            || echo "db backup FAILED at $${ts}"
          tar czf "/backup/media_$${ts}.tar.gz" -C /media . \
            && echo "media backup written: media_$${ts}.tar.gz" \
            || echo "media backup FAILED at $${ts}"
          cp /vapid/vapid_private.pem /backup/vapid_private.pem 2>/dev/null \
            && echo "vapid key copied" || echo "vapid key not found (yet)"
          find /backup -name 'kryptovox_*.sql.gz' -mtime +$${BACKUP_RETENTION_DAYS} -delete
          find /backup -name 'media_*.tar.gz' -mtime +$${BACKUP_RETENTION_DAYS} -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kryptovox-vapid:
  kryptovox-media:

# ===========================================================================
# Set these in Portainer → Stack → Environment variables:
#
#   IMAGE_PREFIX             ghcr.io/jwapps-app/kryptovox
#   IMAGE_TAG               latest
#   POSTGRES_USER           kryptovox
#   POSTGRES_PASSWORD       <long random password>
#   POSTGRES_DB             kryptovox
#   SECRET_KEY              <64-char random hex>
#   ALLOWED_ORIGINS         https://chat.yourdomain.com
#   WEBAUTHN_RP_ID          yourdomain.com          (passkeys; registrable parent domain)
#   WEBAUTHN_ORIGIN         https://chat.yourdomain.com  (full https origin)
#   VAPID_EMAIL             mailto:you@yourdomain.com
#   WEB_PORT                8095         (host port nginx is published on)
#   BACKEND_WORKERS         4            (optional)
#   DEFAULT_RETENTION_DAYS  0            (optional; 0 = keep messages forever)
#   BACKUP_RETENTION_DAYS   14           (optional; keep <= retention for true deletion)
# ===========================================================================
