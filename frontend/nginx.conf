# Serves the built PWA and proxies /api (incl. /api/ws) to the backend.
# TLS is terminated by Cloudflare Tunnel, so nginx listens plain on :80.
upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Security headers (Cloudflare also sets HSTS; belt-and-suspenders here).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; manifest-src 'self'; worker-src 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API + WebSocket proxy.
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    # Hashed static assets — safe to cache forever (content-hashed filenames).
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker, its imports, the manifest and the app entry must NEVER
    # be cached (by the browser OR Cloudflare). A stale sw.js precaches old asset
    # hashes that no longer exist, fails to install, and hangs the app.
    location ~* ^/(sw\.js|push-sw\.js|manifest\.webmanifest|index\.html)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
    }

    # SPA fallback — the served index.html must also be revalidated each load.
    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
